<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Repora</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 24rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #18181b;
        border-radius: 24px;
        padding: 32px;
      }
      .brand { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #a3e635; font-weight: 600; }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { color: #a1a1aa; font-size: 14px; margin-top: 8px; }
      button {
        margin-top: 20px; background: #65a30d; color: #fff; border: 0; border-radius: 12px;
        padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="brand">Repora</p>
      <h1>You&rsquo;re offline</h1>
      <p>Your plans and logs need a connection. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
